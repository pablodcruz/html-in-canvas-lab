name: Atlas worker chart browser checks
on:
  pull_request:
    paths:
      - features.html
      - features.css
      - features.js
      - styles.css
      - tests/replay-worker-motion.*
      - .github/workflows/worker-motion-pr.yml
permissions:
  contents: read
jobs:
  worker-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Playwright and headless Chromium
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps --only-shell chromium
      - name: Check animation start, stop, and canvas fallback
        run: python -u tests/replay-worker-motion.py
